name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # Publish the matching formal GitHub release after npm succeeds.
  id-token: write  # Required for npm provenance attestation (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production  # Requires manual approval before publish

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # npm Trusted Publishing requires npm >= 11.5.1. GitHub's Node 24
          # toolchain includes a compatible npm without a brittle global upgrade.
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci --ignore-scripts

      - name: Install MCP App dependencies
        run: npm run install:apps

      - name: Verify version matches tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package.json ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      # .npmrc disables lifecycle hooks, so build:sn will not trigger
      # prebuild:sn. Run the version writer explicitly before any verification
      # or packaging step to keep the published runtime version in sync.
      - name: Synchronize runtime version
        run: node scripts/write-version.mjs

      - name: Lint package-lock.json
        run: npm run lint:lockfile

      - name: Verify dependency contracts
        run: npm run verify:deps

      - name: Dependency cooldown (enforced on release)
        run: npm run check:dep-age
        env:
          SN_DEP_AGE_ENFORCE: "true"
          SN_DEP_MIN_AGE_DAYS: "14"
        # Release is stricter than CI: young deps block publish.

      - name: Lint tool descriptions
        run: npm run lint:tools

      - name: Verify tools.lock.json drift
        run: npm run verify:lock

      - name: Materialize internal needle list
        env:
          SN_FORBIDDEN_NEEDLES: ${{ secrets.SN_FORBIDDEN_NEEDLES }}
        run: |
          if [ -z "$SN_FORBIDDEN_NEEDLES" ]; then
            echo "::error::SN_FORBIDDEN_NEEDLES is not configured. A release must not ship with the internal-identifier checks disabled."
            exit 1
          fi
          printf '%s\n' "$SN_FORBIDDEN_NEEDLES" > "$RUNNER_TEMP/forbidden.txt"
          echo "SN_FORBIDDEN_FILE=$RUNNER_TEMP/forbidden.txt" >> "$GITHUB_ENV"

      - name: Verify public metadata contract
        run: npm run verify:metadata

      - name: Audit (critical)
        run: npm audit --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Prepare publish artifacts
        run: npm run clean && npm run build:all

      - name: Verify pack contents
        run: |
          npm pack --dry-run 2>&1 | tee pack-output.txt
          if grep -E '(src/|\.test\.|\.spec\.|vitest|tsconfig|\.env|\.github|gitleaks)' pack-output.txt; then
            echo "ERROR: unexpected files found in pack output"
            exit 1
          fi

      - name: Publish
        # Trust is configured on npmjs.com → package → Access → Trusted Publisher:
        #   org=socialneuron, repo=mcp-server, workflow=release.yml, env=production
        # Requires: permissions.id-token: write (set above) + production environment gate.
        # Deliberately no long-lived NPM_TOKEN fallback: npm authenticates this
        # exact workflow through short-lived GitHub OIDC Trusted Publishing.
        # --provenance generates an attestation signed via GitHub OIDC.
        # https://docs.npmjs.com/trusted-publishers
        run: npm publish --ignore-scripts --access public --provenance

      - name: Publish matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
          --latest

      - name: Verify npm/GitHub release consistency
        timeout-minutes: 10
        run: |
          # npm propagation can lag a successful Trusted Publishing run. Keep
          # this verification-only wait bounded at ten minutes; never republish
          # or retag from a consistency check.
          for attempt in $(seq 1 60); do
            npm run verify:release:live && exit 0
            sleep 10
          done
          exit 1
