name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # The action already supplies --fail. Scan verified and unknown
          # (unverifiable, e.g. Supabase service-role keys) results; exclude the
          # low-signal filtered bucket to keep false positives down.
          extra_args: --results=verified,unknown
