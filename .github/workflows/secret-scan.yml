name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          # The action already supplies --fail. Scan verified and unknown
          # (unverifiable, e.g. Supabase service-role keys) results; exclude the
          # low-signal filtered bucket to keep false positives down.
          extra_args: --results=verified,unknown
