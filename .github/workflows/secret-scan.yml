name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          # The action already supplies --fail. Scan verified and unknown
          # (unverifiable, e.g. Supabase service-role keys) results; exclude the
          # low-signal filtered bucket to keep false positives down.
          extra_args: --results=verified,unknown
