name: Release SDK

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: packages/sdk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # npm Trusted Publishing requires npm >=11.5.1; Node 24 includes it.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install SDK dependencies
        run: npm ci --ignore-scripts

      - name: Verify version matches tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${REF_NAME#sdk-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package.json ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Prepare publish artifacts
        run: npm run clean && npm run build

      - name: Verify pack contents
        run: |
          npm pack --dry-run 2>&1 | tee pack-output.txt
          if grep -E '(src/|\.test\.|\.spec\.|tsconfig)' pack-output.txt; then
            echo "ERROR: unexpected files found in pack output"
            exit 1
          fi

      - name: Verify packaged license
        run: |
          npm pack --ignore-scripts --json > sdk-pack.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          import tarfile

          packs = json.loads(Path("sdk-pack.json").read_text())
          if len(packs) != 1:
              raise SystemExit("ERROR: expected one SDK package")
          filename = packs[0]["filename"]
          if Path(filename).name != filename or not filename.endswith(".tgz"):
              raise SystemExit("ERROR: invalid SDK package filename")
          with tarfile.open(filename, "r:gz") as archive:
              matches = [entry for entry in archive.getmembers() if entry.name == "package/LICENSE"]
              if len(matches) != 1 or not matches[0].isfile():
                  raise SystemExit("ERROR: SDK package must contain one regular LICENSE")
              contents = archive.extractfile(matches[0]).read()
          if contents != Path("../../LICENSE").read_bytes():
              raise SystemExit("ERROR: SDK package LICENSE differs from repository LICENSE")
          print("SDK package LICENSE matches repository LICENSE")
          PY

      - name: Publish
        # Configure this exact workflow as the package's npm Trusted Publisher.
        # No reusable registry token is accepted by the release job.
        run: npm publish --ignore-scripts --provenance --access public
